<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>清除缓存 - 刷题神器</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 60px 20px; text-align: center; background: #f3f4f6; color: #374151; }
    .box { max-width: 480px; margin: 0 auto; background: white; border-radius: 16px; padding: 40px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 22px; margin-bottom: 16px; color: #111827; }
    p { font-size: 16px; line-height: 1.6; margin: 12px 0; }
    .loading { display: inline-block; width: 24px; height: 24px; border: 3px solid #e5e7eb; border-top-color: #1d4ed8; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <h1>正在清理旧缓存</h1>
    <p>请稍候，完成后会自动跳转到考试页面...</p>
    <div class="loading"></div>
    <p id="status">准备中</p>
  </div>

  <script>
    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    async function clearAll() {
      try {
        // 1. 注销所有 Service Worker
        if ('serviceWorker' in navigator) {
          setStatus('正在注销 Service Worker...');
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
          }
        }

        // 2. 清理缓存
        if ('caches' in window) {
          setStatus('正在清理本地缓存...');
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
        }

        // 3. 清理 localStorage 中考试相关数据
        setStatus('正在清理考试记录...');
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.startsWith('dailyExam_') || key.startsWith('examResults_') || key.includes('Exam'))) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));

        setStatus('清理完成，正在跳转...');
        setTimeout(() => {
          window.location.replace('./index.html?fresh=' + Date.now());
        }, 800);
      } catch (err) {
        setStatus('清理出错：' + err.message + '，请手动刷新');
      }
    }

    clearAll();
  </script>
</body>
</html>
